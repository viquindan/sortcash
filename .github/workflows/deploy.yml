name: Deploy to VPS

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 217.196.60.193
          username: root
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
            nvm use 20
            cd /var/www/sortcash
            GIT_SSH_COMMAND="ssh -i ~/.ssh/id_github_deploy" git pull origin main
            npm install --production=false
            npm run build
            pm2 restart sortcash
            pm2 save
